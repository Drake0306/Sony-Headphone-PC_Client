name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Frontend check
        run: pnpm check
        working-directory: apps/desktop
      - name: Frontend tests
        run: pnpm test
        working-directory: apps/desktop
      - name: Build transport
        run: cargo build -p mdr-transport

  windows-crates:
    # Protocol crates and the Windows transport; the app is in windows-app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p mdr-frame -p mdr-proto -p mdr-session -p mdr-transport
      - name: Clippy
        run: cargo clippy -p mdr-transport --all-targets -- -D warnings

  windows-app:
    # The whole Tauri app on Windows: the frontend build first, because the
    # app's build script embeds ../dist.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop
      - name: Test
        run: cargo test -p shdc
      - name: Clippy
        run: cargo clippy -p shdc --all-targets -- -D warnings

  linux-app:
    # The crates, the Linux transport and the whole Tauri app on Linux:
    # libdbus for bluer (BlueZ over D-Bus), WebKitGTK and the appindicator
    # library for Tauri and its tray. The frontend is built first, because
    # the app's build script embeds ../dist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
