name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<SHDC_NOTES"
            cat .github/release-notes.md
            echo "SHDC_NOTES"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (.app.tar.gz, .msi, -setup.exe) with
          # the key whose public half is in tauri.conf.json. No password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: SHDC ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # latest.json: the feed the installed apps check for updates.
          includeUpdaterJson: true

  # The feed the installed apps read. tauri-action's latest.json names the
  # github.com download links; this job points them at api.github.com (which
  # redirects to the file) and publishes the result twice: on the release
  # itself, and on the `updates` branch for raw.githubusercontent.com, the
  # app's fallback feed when the github.com download host is failing.
  feed:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite latest.json with API download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern latest.json --output /tmp/latest.json
          mkdir -p /tmp/feed
          python3 .github/scripts/api-feed.py "${{ github.repository }}" "${{ github.ref_name }}" /tmp/latest.json /tmp/feed/latest.json
          gh release upload "${{ github.ref_name }}" /tmp/feed/latest.json --clobber
      - name: Publish the fallback feed on the updates branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin updates
          git checkout -B updates origin/updates
          cp /tmp/feed/latest.json latest.json
          git add latest.json
          git commit -m "Update feed for ${{ github.ref_name }}" || echo "feed unchanged"
          git push origin updates
