[package]
name = "hairline"
version = "0.1.0"
description = "Hairline: a desktop controller for the ULT WEAR headphones"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "hairline_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdr-proto = { path = "../../../crates/mdr-proto" }
mdr-session = { path = "../../../crates/mdr-session" }
mdr-transport = { path = "../../../crates/mdr-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
chrono = "0.4"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2.4", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }

[dev-dependencies]
mdr-frame = { path = "../../../crates/mdr-frame" }
