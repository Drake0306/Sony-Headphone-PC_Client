[package]
name = "mdr-cli"
version = "0.1.0"
description = "shdcctl: control the running SHDC (Sony Headphone Desktop Client) app from a terminal"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "shdcctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
